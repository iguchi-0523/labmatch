name: Hourly Monitor (24/7)

# 24 時間体制で、毎時 00 分に DB 状態をログ出力。
# recurring-ingest の進捗確認用（旧 nightly-ingest）。
#
# 初期構築フェーズ完走後、頻度を下げたいときは cron を
# `0 0,15-23 * * *`（0-9 JST のみ）等に戻す。

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # 手動でいつでも実行可能

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: DB status snapshot
        run: npx tsx scripts/db-status.ts
